[package]
name = "ytplay"
version = "2.0.1"
edition = "2024"
description = "Single-file terminal YouTube audio streamer with Rust playback"
build = "build.rs"

[dependencies]
anyhow = "1"
crossterm = "0.29"
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-aac", "symphonia-isomp4", "symphonia-wav"] }
serde_json = "1"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
