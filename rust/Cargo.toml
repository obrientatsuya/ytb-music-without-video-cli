[package]
name = "ytplay"
version = "2.0.0"
edition = "2024"
description = "Single-file terminal YouTube audio streamer with Rust playback"
build = "build.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
dirs = "7"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "webpki-roots"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-aac", "symphonia-isomp4", "symphonia-wav"] }
serde_json = "1"
tempfile = "3"
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
